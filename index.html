<html lang="en"><head>

<title>CozyRoads — an endless cozy drive</title>
<meta name="description" content="Drive an endless, procedurally generated road. Smooth, calm and made for phones.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%236f7a3c%27/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0e1214;color:#fff;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:300}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.b{position:fixed;border:1.5px solid rgba(255,255,255,.65);border-radius:50%;background:rgba(255,255,255,.07);color:#fff;font:inherit;font-size:11px;letter-spacing:.12em;display:grid;place-items:center;padding:0;cursor:pointer}
.b.on,.b:active{background:rgba(255,255,255,.28)}
#brk{left:calc(env(safe-area-inset-left) + 92px);bottom:28px;width:92px;height:92px;font-size:13px}
#bst{right:calc(env(safe-area-inset-right) + 40px);bottom:120px;width:70px;height:70px}
#tb{position:fixed;top:12px;right:calc(env(safe-area-inset-right) + 14px);display:flex;gap:10px}
#tb .b{position:static;width:46px;height:46px;font-size:10px}#tb #mode{width:auto;padding:0 18px;border-radius:23px;border-color:#fff}
#thr{position:fixed;left:calc(env(safe-area-inset-left) + 30px);bottom:28px;width:44px;height:min(58vh,270px);border-radius:22px;border:1.5px solid rgba(255,255,255,.5);background:rgba(255,255,255,.05)}
#thr i{position:absolute;left:2px;width:37px;height:37px;border-radius:50%;border:1.5px solid #fff;background:rgba(255,255,255,.2);bottom:0}
#thr span{position:absolute;top:-22px;left:0;right:0;text-align:center;font-size:10px;letter-spacing:.14em;opacity:.7}
#pad{position:fixed;right:calc(env(safe-area-inset-right) + 24px);bottom:24px;width:min(46vw,310px);height:78px;border-radius:39px;border:1.5px solid rgba(255,255,255,.5);background:rgba(255,255,255,.05)}
#pad::before{content:"";position:absolute;left:30px;right:30px;top:50%;height:1px;background:rgba(255,255,255,.35)}
#pad i{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;border:1.5px solid #fff;background:rgba(255,255,255,.18)}
.read{position:fixed;text-align:center;pointer-events:none;text-shadow:0 0 12px rgba(0,0,0,.25)}
#spd{left:50%;bottom:22px;transform:translateX(-50%)}#dst{left:50%;top:14px;transform:translateX(-50%)}
.read b{display:block;font-size:40px;font-weight:200;letter-spacing:.06em;line-height:1}
.read small{display:block;font-size:10px;letter-spacing:.2em;opacity:.7;margin-top:6px}
#dst b{font-size:26px}
#zone{position:fixed;left:50%;top:100px;transform:translateX(-50%);font-size:12px;letter-spacing:.32em;opacity:0;transition:opacity 1s;pointer-events:none;text-shadow:0 0 12px rgba(0,0,0,.45)}#auto{position:fixed;left:50%;top:78px;transform:translateX(-50%);font-size:10px;letter-spacing:.2em;opacity:.75;pointer-events:none}
#start,#panel,#rot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center}
#start{background:#1f1d3f;gap:16px;z-index:5;overflow:hidden}#start>*{position:relative;z-index:1}#start>svg#bg{position:absolute;inset:0;width:100%;height:100%;z-index:0}#start h1{text-shadow:0 2px 24px rgba(40,10,50,.55)}#start p{text-shadow:0 1px 12px rgba(40,10,50,.6)}
#start h1{margin:0;font-size:clamp(34px,8vmin,72px);font-weight:200;letter-spacing:.22em;text-indent:.22em}
#start p{margin:0;font-size:13px;letter-spacing:.08em;opacity:.85;max-width:420px;line-height:1.6;padding:0 20px}
#go{margin-top:10px;padding:16px 46px;font:inherit;font-size:14px;letter-spacing:.3em;color:#fff;background:rgba(14,18,20,.55);border:1.5px solid #fff;border-radius:40px;cursor:pointer}
#panel{background:rgba(10,14,16,.72);z-index:4}
#panel[hidden],#start[hidden]{display:none}
.card{position:relative;display:flex;flex-direction:column;width:min(92vw,560px);max-height:calc(100vh - 20px);max-height:calc(100dvh - 20px);overflow:hidden;padding:18px 20px;border:1px solid rgba(255,255,255,.35);border-radius:18px;background:rgba(18,24,27,.95)}#rows{overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;min-height:0}#x{position:absolute;top:10px;right:10px;width:40px;height:40px;padding:0;border-radius:50%;border:1.5px solid rgba(255,255,255,.65);background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;cursor:pointer;z-index:2}#x:active{background:rgba(255,255,255,.3)}
.card h2{margin:0 52px 10px 0;line-height:40px;font-weight:300;font-size:16px;letter-spacing:.2em}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid rgba(255,255,255,.12);font-size:12px}
.row>div{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{font:inherit;font-size:12px;color:#fff;background:none;border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:7px 13px;cursor:pointer}
.chip.sel{background:#fff;color:#0e1214}.chip.sw{width:30px;height:30px;padding:0;border-radius:50%}.chip.sw.sel{outline:2px solid #fff;outline-offset:2px;border-color:transparent}
.card .chip.close{margin-top:14px;width:100%}
#rot{display:none;background:#0e1214;z-index:9;font-size:14px;letter-spacing:.14em}
@media (orientation:portrait) and (pointer:coarse){#rot{display:flex}}
@media (max-height:420px){.row{padding:6px 0}.card{padding:10px 14px}.chip{padding:5px 11px}.chip.sw{width:26px;height:26px;padding:0}.read b{font-size:30px}#brk{width:78px;height:78px;left:calc(env(safe-area-inset-left) + 84px)}#bst{bottom:104px}}
